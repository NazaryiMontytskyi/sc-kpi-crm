# Production-like stack:  docker compose -f deploy/docker-compose.yml up --build -d
# Configuration comes from deploy/.env (copy deploy/.env.example; never commit it).
# Topology and rationale: docs/adr/0008-deployment-topology.md
name: crm

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm}
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # prod by default; dev only for local evaluation (see deploy/.env.example).
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-crm}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-crm}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      CRM_FILES_ROOT: /var/lib/crm/files
      CRM_BOOTSTRAP_ADMIN_LOGIN: ${CRM_BOOTSTRAP_ADMIN_LOGIN:-}
      CRM_BOOTSTRAP_ADMIN_PASSWORD: ${CRM_BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - files:/var/lib/crm/files
    # Not published on the host: reachable only through nginx.
    expose:
      - '8080'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8080/actuator/health']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      CRM_DOMAIN: ${CRM_DOMAIN:-localhost}
      TLS_CERT_FILE: ${TLS_CERT_FILE:-fullchain.pem}
      TLS_KEY_FILE: ${TLS_KEY_FILE:-privkey.pem}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./nginx/${NGINX_TEMPLATE:-http.conf.template}:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/crm-common.conf:/etc/nginx/snippets/crm-common.conf:ro
      # Certificates for https.conf.template; with the default HTTP mode this directory is simply unused.
      - ${TLS_CERT_DIR:-./nginx/tls}:/etc/nginx/tls:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/actuator/health']
      interval: 15s
      timeout: 5s
      retries: 5

  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ['bash', '/scripts/backup-loop.sh']
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-crm}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-crm}
      FILES_DIR: /data/files
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-02}
    volumes:
      - ./backup:/scripts:ro
      - files:/data/files
      # Backup target: a host directory (e.g. a mounted network share) or the default named volume.
      - ${BACKUP_TARGET:-backups}:/backups

volumes:
  pgdata:
  files:
  backups:
