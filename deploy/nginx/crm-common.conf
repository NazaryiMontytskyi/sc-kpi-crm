# Shared by http.conf.template and https.conf.template (included inside a server block).
root /usr/share/nginx/html;
index index.html;
client_max_body_size 25m;   # backend limit is crm.files.max-size (20MB) plus multipart overhead

gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Mantine injects inline styles, hence style-src 'unsafe-inline'; scripts are same-origin only.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

# Same domain for SPA and API: the session and XSRF cookies never cross origins.
location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# Only the health probe of the actuator is reachable from outside.
location = /actuator/health {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Hashed build artefacts: cache for a long time.
location /assets/ {
    expires 1y;
    try_files $uri =404;
}

# SPA fallback; index.html must always be revalidated.
location / {
    expires -1;
    try_files $uri $uri/ /index.html;
}
