# Local development database. Used by spring-boot-docker-compose (spring.docker.compose.file).
# Credentials come from the environment; the defaults are development-only placeholders.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm}
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-dev-only}
    ports:
      - '5432'
    volumes:
      - crm-dev-pgdata:/var/lib/postgresql/data

volumes:
  crm-dev-pgdata:
