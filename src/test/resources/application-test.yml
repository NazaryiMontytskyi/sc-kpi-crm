# Test-only overrides (profile "test").
spring:
  datasource:
    hikari:
      # Many cached Spring contexts share one Postgres container: keep each pool small
      maximum-pool-size: 4
      minimum-idle: 1
crm:
  identity:
    public-api-docs: true
    password:
      bcrypt-strength: 4 # fast hashing; production default is 12
  files:
    root: target/test-data/files
